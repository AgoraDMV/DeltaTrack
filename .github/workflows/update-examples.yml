name: Publish examples

# Deploys the committed `examples/` reports to GitHub Pages as the public demo.
#
# This job used to *render* two of those reports itself, with its own
# `diff_bill.py compare` invocation against a freshly downloaded bill (#42). That made
# CI a second renderer: its output was never compared to anything, so when it stopped
# running successfully the published demo silently froze fifteenfold behind the real
# renderer while the repo's own tests stayed green.
#
# Rendering now happens in exactly one place — `scripts/render_examples.py`, run by a human and
# committed — and `tests/test_committed_examples.py` fails the normal CI job if what is
# committed is not what the current pipeline emits. So the files this job publishes are
# already proven fresh, and it only has to copy them.
on:
  push:
    branches: [main]

concurrency:
  group: update-examples
  cancel-in-progress: true

jobs:
  publish-examples:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage Pages content
        # Pages takes a single directory artifact; copy the committed
        # examples/ outputs into the staging dir. index.html is the landing page.
        run: |
          mkdir -p _site
          cp -r examples/. _site/

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
