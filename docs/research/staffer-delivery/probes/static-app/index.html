<!doctype html>
<meta charset="utf-8" />
<title>DeltaTrack static-delivery spike</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  #log { background: #111; color: #d8d8d8; padding: 1rem; border-radius: 6px; white-space: pre-wrap;
         font: 12.5px/1.45 ui-monospace, Menlo, monospace; min-height: 16rem; }
  .row { display: flex; gap: 1rem; align-items: center; margin: .75rem 0; }
  .ok { color: #3ad07a } .bad { color: #ff6b6b } .warn { color: #ffc94d }
  button { padding: .5rem 1rem; font-size: 15px; }
</style>

<h1>DeltaTrack static-delivery spike</h1>
<p>Probes which browser capabilities a fully local DeltaTrack would need, then runs the
   real Python engine on two bill XML files chosen from disk. Nothing is uploaded.</p>

<div class="row"><strong>Origin:</strong> <code id="origin"></code></div>
<div class="row">
  <label>Old XML <input type="file" id="f1" accept=".xml"></label>
  <label>New XML <input type="file" id="f2" accept=".xml"></label>
  <button id="go" disabled>Compare</button>
</div>
<div id="log">booting…</div>

<script type="module">
const logEl = document.getElementById("log");
const t00 = performance.now();
// Build nodes and set textContent rather than concatenating into innerHTML. Messages
// include user-chosen file names, so string-building HTML here reinterprets DOM text as
// markup (CodeQL js/xss-through-dom). Nothing in this log needs markup.
const log = (m, cls = "") => {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = `[${((performance.now() - t00) / 1000).toFixed(2)}s] ${m}`;
  logEl.append("\n", span);
};
logEl.textContent = "";
document.getElementById("origin").textContent = `${location.protocol}//${location.host || "(none)"} — origin ${window.origin}`;

// ---- Capability probes: exactly the features a local DeltaTrack depends on ----
log(`protocol            : ${location.protocol}`);
log(`window.origin       : ${window.origin}`);
log(`isSecureContext     : ${window.isSecureContext}`, window.isSecureContext ? "ok" : "bad");
log(`crossOriginIsolated : ${window.crossOriginIsolated}`);
log(`WebAssembly         : ${typeof WebAssembly === "object" ? "present" : "ABSENT"}`);
log(`Worker constructor  : ${typeof Worker === "function" ? "present" : "ABSENT"}`);
log(`File System Access  : ${typeof window.showOpenFilePicker === "function" ? "present" : "absent (input[type=file] still works)"}`);
log(`SharedArrayBuffer   : ${typeof SharedArrayBuffer === "function" ? "present" : "absent"}`);

// Can we fetch a same-directory asset at all? This is THE file:// blocker.
try {
  const r = await fetch("./probe.txt");
  log(`fetch same-dir      : OK (${r.status}) "${(await r.text()).trim()}"`, "ok");
} catch (e) {
  log(`fetch same-dir      : BLOCKED — ${e.name}: ${e.message}`, "bad");
  log(`  → Pyodide loads pyodide.asm.wasm and python_stdlib.zip by fetch, so this is fatal for file://`, "bad");
}
// Can we start a Worker? Pyodide is normally run off-main-thread.
try {
  const w = new Worker("./probe-worker.js", { type: "module" });
  await new Promise((res, rej) => {
    w.onmessage = (e) => { log(`Worker (module)     : OK — replied "${e.data}"`, "ok"); w.terminate(); res(); };
    w.onerror = (e) => rej(new Error(e.message || "worker error event"));
    setTimeout(() => rej(new Error("timeout")), 3000);
  });
} catch (e) {
  log(`Worker (module)     : BLOCKED — ${e.message}`, "bad");
}

// ---- Load the real Pyodide + the real DeltaTrack engine --------------------
let pyodide = null;
try {
  const tB = performance.now();
  const { loadPyodide } = await import("./pyodide/pyodide.mjs");
  pyodide = await loadPyodide({ indexURL: "./pyodide/" });
  log(`Pyodide boot        : ${(performance.now() - tB).toFixed(0)} ms`, "ok");

  const tE = performance.now();
  // engine.zip = src/deltatrack + the pypdfium2 stub, zipped at build time.
  const buf = await (await fetch("./engine.zip")).arrayBuffer();
  pyodide.unpackArchive(buf, "zip", { extractDir: "/engine" });
  await pyodide.runPythonAsync(`
import sys; sys.path.insert(0, "/engine")
from deltatrack.compare.xml import compare_xml_html
import platform
print("python", sys.version.split()[0], platform.machine())
`);
  log(`DeltaTrack engine   : imported in ${(performance.now() - tE).toFixed(0)} ms`, "ok");
  document.getElementById("go").disabled = false;
  log(`READY — pick two bill XML files and press Compare.`, "ok");
} catch (e) {
  log(`Engine load FAILED  : ${e.name}: ${e.message}`, "bad");
}

// ---- Real comparison, entirely in-page -------------------------------------
document.getElementById("go").onclick = async () => {
  const f1 = document.getElementById("f1").files[0];
  const f2 = document.getElementById("f2").files[0];
  if (!f1 || !f2) { log("pick both files first", "warn"); return; }
  log(`comparing ${f1.name} (${(f1.size / 1e6).toFixed(2)} MB) → ${f2.name} (${(f2.size / 1e6).toFixed(2)} MB)`);
  const t = performance.now();
  pyodide.globals.set("_b1", new Uint8Array(await f1.arrayBuffer()));
  pyodide.globals.set("_b2", new Uint8Array(await f2.arrayBuffer()));
  const html = await pyodide.runPythonAsync(
    `compare_xml_html(bytes(_b1.to_py()), bytes(_b2.to_py()), start_label="v1", end_label="v2")`
  );
  const ms = performance.now() - t;
  log(`diff + render       : ${ms.toFixed(0)} ms → report ${(html.length / 1024).toFixed(0)} KB`, "ok");
  const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  const a = document.createElement("a");
  a.href = url; a.textContent = "open the generated report"; a.target = "_blank";
  logEl.append(document.createElement("br"), a);
};
</script>
