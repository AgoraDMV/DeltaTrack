<!doctype html>
<meta charset="utf-8" />
<title>DeltaTrack single-file file:// probe</title>
<!-- Deliberately uses NO fetch(), NO Worker, NO ES module, NO external asset.
     This isolates the question "what can ONE self-contained HTML file do when a
     staffer double-clicks it?" from "can Pyodide load from file://" (it cannot).
     Everything a TypeScript/JS DeltaTrack port would rely on is probed here. -->
<style>
 body{font:15px/1.5 system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem}
 #log{background:#111;color:#d8d8d8;padding:1rem;border-radius:6px;white-space:pre-wrap;
      font:12.5px/1.45 ui-monospace,Menlo,monospace;min-height:14rem}
 .ok{color:#3ad07a}.bad{color:#ff6b6b}
</style>
<h1>Single-file <code>file://</code> capability probe</h1>
<p>Pick two files. Everything runs inline; nothing is fetched.</p>
<p><input type="file" id="f1"> <input type="file" id="f2"> <button id="go">Process</button></p>
<div id="log"></div>
<script>
(function () {
  var logEl = document.getElementById("log");
  // textContent on a built node, not innerHTML: these messages carry user-chosen file
  // names, and nothing here needs markup (CodeQL js/xss-through-dom).
  function log(m, c) {
    var span = document.createElement("span");
    if (c) span.className = c;
    span.textContent = m;
    logEl.append(span, "\n");
  }

  log("protocol             : " + location.protocol);
  log("window.origin        : " + window.origin);
  log("isSecureContext      : " + window.isSecureContext, window.isSecureContext ? "ok" : "bad");
  log("WebAssembly          : " + (typeof WebAssembly === "object" ? "present" : "ABSENT"));
  log("FileReader           : " + (typeof FileReader === "function" ? "present" : "ABSENT"));
  log("Blob + URL.createObjectURL: " + (typeof Blob === "function" && URL.createObjectURL ? "present" : "ABSENT"));
  log("showSaveFilePicker   : " + (typeof window.showSaveFilePicker === "function" ? "present" : "absent"));
  log("localStorage         : " + (function () { try { localStorage.setItem("t", "1"); localStorage.removeItem("t"); return "writable"; } catch (e) { return "BLOCKED (" + e.name + ")"; } })());
  log("TextDecoder          : " + (typeof TextDecoder === "function" ? "present" : "ABSENT"));
  log("DOMParser (XML)      : " + (typeof DOMParser === "function" ? "present" : "ABSENT"));

  // Instantiate a real WASM module from INLINE BYTES (no fetch). This is the
  // question that decides whether a single-file app could carry a WASM engine.
  try {
    // (module (func (export "add") (param i32 i32) (result i32) local.get 0 local.get 1 i32.add))
    var wasm = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
    var inst = new WebAssembly.Instance(new WebAssembly.Module(wasm));
    log("WASM from inline bytes: OK — add(2,3)=" + inst.exports.add(2, 3), "ok");
  } catch (e) {
    log("WASM from inline bytes: BLOCKED — " + e.name + ": " + e.message, "bad");
  }

  document.getElementById("go").onclick = function () {
    var a = document.getElementById("f1").files[0], b = document.getElementById("f2").files[0];
    if (!a || !b) { log("pick two files", "bad"); return; }
    var t0 = performance.now();
    var r1 = new FileReader(), r2 = new FileReader(), got = {};
    function done(k, v) {
      got[k] = v;
      if (got.a === undefined || got.b === undefined) return;
      log("read both files      : " + (got.a.byteLength / 1e6).toFixed(2) + " MB + " +
          (got.b.byteLength / 1e6).toFixed(2) + " MB in " + (performance.now() - t0).toFixed(0) + " ms", "ok");
      // Parse as XML entirely in-page, to show real local processing works.
      try {
        var txt = new TextDecoder().decode(got.a);
        var doc = new DOMParser().parseFromString(txt, "application/xml");
        var secs = doc.getElementsByTagName("section").length;
        log("DOMParser on file 1  : OK — " + secs + " <section> elements", "ok");
      } catch (e) { log("DOMParser            : FAILED " + e.message, "bad"); }
      // Can we hand the user a downloaded report from file:// ?
      try {
        var url = URL.createObjectURL(new Blob(["<h1>report</h1>"], { type: "text/html" }));
        var link = document.createElement("a");
        link.href = url; link.download = "deltatrack-report.html"; link.textContent = "download the report";
        logEl.appendChild(link);
        log("\nBlob download link   : created OK (click it to verify the browser accepts it)", "ok");
      } catch (e) { log("Blob download        : FAILED " + e.message, "bad"); }
    }
    r1.onload = function () { done("a", r1.result); }; r1.readAsArrayBuffer(a);
    r2.onload = function () { done("b", r2.result); }; r2.readAsArrayBuffer(b);
  };
})();
</script>
